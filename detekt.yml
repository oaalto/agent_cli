build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true

coroutines:
  InjectDispatcher:
    active: false
  RedundantSuspendModifier:
    active: true

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 10
  CognitiveComplexMethod:
    active: true
    threshold: 12
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
  TooManyFunctions:
    ignoreOverridden: true
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInObjects: 12

exceptions:
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - NoSuchMethodException
      - ClassNotFoundException
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true

naming:
  MatchingDeclarationName:
    active: true

performance:
  SpreadOperator:
    active: true

potential-bugs:
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  DoubleMutabilityForCollection:
    active: false

style:
  ReturnCount:
    active: true
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
    ignoreHashCodeFunction: true
  MaxLineLength:
    active: false
  UseOrEmpty:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedPrivateClass:
    active: true
