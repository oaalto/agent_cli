build:
  maxIssues: 0

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 10
  CognitiveComplexMethod:
    active: true
    threshold: 12
  TooManyFunctions:
    ignoreOverridden: true
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInObjects: 12

style:
  ReturnCount:
    active: true
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
    ignoreHashCodeFunction: true
  MaxLineLength:
    active: false
