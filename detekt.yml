build:
  maxIssues: 0

complexity:
  TooManyFunctions:
    ignoreOverridden: true

style:
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
    ignoreHashCodeFunction: true
  MaxLineLength:
    active: false
